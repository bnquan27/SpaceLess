[package]
name = "spaceless-cloudflare-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind"] }
email_address = { version = "0.2", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio-postgres = { version = "0.7", default-features = false, features = ["js", "with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["js", "v4", "serde"] }
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
worker = { version = "0.9", features = ["tokio-postgres"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
